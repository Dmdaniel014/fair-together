<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Type · Display & Headings</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display:flex; align-items:baseline; gap:16px; padding:8px 0; border-bottom:1px dashed var(--border-dim); }
  .row:last-child { border-bottom:0; }
  .spec { font-family:var(--font-mono); font-size:10px; color:var(--color-fg3); min-width:130px; }
  .sample { flex:1; }
</style>
</head>
<body>
  <div class="row"><div class="spec">display-lg · 28/38 · 700</div><div class="sample ft-display-lg">הכסף שלך מחכה</div></div>
  <div class="row"><div class="spec">display-md · 22/30 · 700</div><div class="sample ft-display-md">היי דניאל!</div></div>
  <div class="row"><div class="spec">h1 · 20/28 · 700</div><div class="sample ft-h1">התאמות חדשות בשבילך</div></div>
  <div class="row"><div class="spec">h2 · 17/24 · 600</div><div class="sample ft-h2">שופרסל — עיגול יתר במחירי מבצע</div></div>
  <div class="row"><div class="spec">h3 · 15/22 · 600</div><div class="sample ft-h3">בחר קטגוריות שמעניינות אותך</div></div>
</body>
</html>

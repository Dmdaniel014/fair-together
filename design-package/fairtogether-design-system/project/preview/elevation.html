<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Elevation · Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:40px 24px; background:#F0F4F8; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .sw { height:100px; background:#fff; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:1px solid var(--border-dim); }
  .name { font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--color-fg1); }
  .val { font-family:var(--font-mono); font-size:9px; color:var(--color-fg3); }
  .a { box-shadow: 0 2px 8px rgba(100,116,139,0.06); }
  .b { box-shadow: 0 4px 12px rgba(100,116,139,0.10); }
  .c { box-shadow: 0 4px 12px rgba(26,86,219,0.20); }
  .d { box-shadow: 0 0 20px rgba(26,86,219,0.15); }
</style>
</head>
<body>
  <div class="sw a"><div class="name">card</div><div class="val">resting</div></div>
  <div class="sw b"><div class="name">card-raised</div><div class="val">hover / press</div></div>
  <div class="sw c" style="background:#1A56DB;color:#fff"><div class="name" style="color:#fff">button</div><div class="val" style="color:rgba(255,255,255,0.8)">primary CTA glow</div></div>
  <div class="sw d"><div class="name">glow</div><div class="val">focus / active</div></div>
</body>
</html>

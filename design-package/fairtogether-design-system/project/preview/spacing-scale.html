<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Spacing · 4-pt grid</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:#fff; display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns:80px 1fr 110px; align-items:center; gap:14px; }
  .name { font-family:var(--font-mono); font-size:11px; color:var(--color-fg2); }
  .bar { height:12px; background:var(--color-primary); border-radius:3px; }
  .val { font-family:var(--font-mono); font-size:10px; color:var(--color-fg3); text-align:left; }
</style>
</head>
<body>
  <div class="row"><div class="name">xs</div><div class="bar" style="width:4px"></div><div class="val">4px · dots / hairlines</div></div>
  <div class="row"><div class="name">sm</div><div class="bar" style="width:8px"></div><div class="val">8px · gap between items in a row</div></div>
  <div class="row"><div class="name">md</div><div class="bar" style="width:12px"></div><div class="val">12px · card → card</div></div>
  <div class="row"><div class="name">base</div><div class="bar" style="width:16px"></div><div class="val">16px · card padding / screen gutter</div></div>
  <div class="row"><div class="name">lg</div><div class="bar" style="width:20px"></div><div class="val">20px · between sections</div></div>
  <div class="row"><div class="name">xl</div><div class="bar" style="width:24px"></div><div class="val">24px · major sections</div></div>
  <div class="row"><div class="name">2xl</div><div class="bar" style="width:32px"></div><div class="val">32px · screen top padding</div></div>
  <div class="row"><div class="name">3xl</div><div class="bar" style="width:48px"></div><div class="val">48px · hero padding</div></div>
</body>
</html>

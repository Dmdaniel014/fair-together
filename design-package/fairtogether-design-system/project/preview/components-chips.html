<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Chips</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:#fff; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .label { font-family:var(--font-mono); font-size:10px; color:var(--color-fg3); min-width:100px; }
  .chip { padding:10px 18px; border-radius:12px; font-family:var(--font-sans); font-weight:500; font-size:14px; background:#fff; color:#0F172A; border:1px solid var(--border-default); }
  .chip.sel { background:#EEF3FD; color:#1A56DB; border:1.5px solid #1A56DB; padding:9.5px 17px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-family:var(--font-sans); font-weight:500; font-size:12px; background:#F1F5F9; color:#334155; }
  .pill.active { background:#1A56DB; color:#fff; }
</style>
</head>
<body>
  <div class="row"><div class="label">chip · default</div><button class="chip">מכולת</button><button class="chip">תקשורת</button><button class="chip">בנקאות</button></div>
  <div class="row"><div class="label">chip · selected</div><button class="chip sel">ביטוח</button><button class="chip sel">מסחר מקוון</button></div>
  <div class="row"><div class="label">filter pill</div><button class="pill active">🏠 הכל</button><button class="pill">📱 תקשורת</button><button class="pill">🏦 בנקים</button><button class="pill">🛒 קמעונאות</button></div>
</body>
</html>

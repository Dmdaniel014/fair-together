<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:#fff; display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
  .sw { aspect-ratio:1; background:var(--color-bg-panel); border:1px solid var(--border-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .name { font-family:var(--font-mono); font-size:10px; color:var(--color-fg2); }
  .val { font-family:var(--font-mono); font-size:9px; color:var(--color-fg3); }
</style>
</head>
<body>
  <div class="sw" style="border-radius:4px"><div class="name">xs</div><div class="val">4</div></div>
  <div class="sw" style="border-radius:8px"><div class="name">sm</div><div class="val">8</div></div>
  <div class="sw" style="border-radius:12px"><div class="name">md</div><div class="val">12</div></div>
  <div class="sw" style="border-radius:16px"><div class="name">lg · card</div><div class="val">16</div></div>
  <div class="sw" style="border-radius:20px"><div class="name">xl</div><div class="val">20</div></div>
  <div class="sw" style="border-radius:24px"><div class="name">2xl</div><div class="val">24</div></div>
  <div class="sw" style="border-radius:999px"><div class="name">pill</div><div class="val">999</div></div>
</body>
</html>

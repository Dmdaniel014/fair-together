<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Type · Mono (data)</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:#fff; font-family:var(--font-sans); }
  .row { display:flex; align-items:center; gap:16px; padding:8px 0; border-bottom:1px dashed var(--border-dim); }
  .row:last-child { border-bottom:0; }
  .spec { font-family:var(--font-mono); font-size:10px; color:var(--color-fg3); min-width:160px; }
  .sample { flex:1; font-family:var(--font-mono); }
  .l1 { font-size:16px; font-weight:600; color:var(--color-fg1); }
  .l2 { font-size:14px; font-weight:500; color:var(--color-fg1); }
  .l3 { font-size:12px; font-weight:500; color:var(--color-fg2); }
  .l4 { font-size:11px; color:var(--color-fg3); }
  .accent { color:#059669; }
  .danger { color:#DC2626; }
  .tag { font-size:9px; letter-spacing:0.4px; text-transform:uppercase; color:var(--color-fg3); }
</style>
</head>
<body>
  <div class="row"><div class="spec">mono-lg · 16/22 · 600</div><div class="sample"><span class="l1 accent">₪300 – 100</span></div></div>
  <div class="row"><div class="spec">mono-md · 14/20 · 500</div><div class="sample"><span class="l2">case: 12345-24-7</span></div></div>
  <div class="row"><div class="spec">mono-sm · 12/18 · 500</div><div class="sample"><span class="l3">match confidence</span> <span class="l3 accent">· 87%</span></div></div>
  <div class="row"><div class="spec">mono-xs · 11/16 · 400</div><div class="sample"><span class="l4">שופרסל · case 12345-24-7</span></div></div>
  <div class="row"><div class="spec">label-xs (caps) · 10/14</div><div class="sample"><span class="tag">settlement approved</span></div></div>
  <div class="row"><div class="spec">deadline accent</div><div class="sample"><span class="l2 danger">31.12.2025</span></div></div>
</body>
</html>

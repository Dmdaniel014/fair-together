<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<title>Colors · Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:#fff; }
  .wrap { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .sw { border-radius:12px; overflow:hidden; border:1px solid var(--border-dim); }
  .bar { height:48px; display:flex; align-items:center; padding:0 14px; color:#fff; font-family:var(--font-sans); font-weight:600; font-size:14px; }
  .body { padding:10px 12px; background:#fff; display:flex; flex-direction:column; gap:4px; }
  .name { font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--color-fg1); }
  .hex { font-family:var(--font-mono); font-size:10px; color:var(--color-fg3); }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-family:var(--font-sans); font-weight:500; font-size:10px; margin-top:4px; width:fit-content; border:1px solid; }
  .dot { width:5px; height:5px; border-radius:999px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="bar" style="background:#059669">Success</div><div class="body"><div class="name">התאמה חזקה</div><div class="hex">#059669 · #D1FAE5</div><span class="pill" style="background:#D1FAE5;color:#059669;border-color:#05966940"><span class="dot" style="background:#059669"></span>משלם</span></div></div>
    <div class="sw"><div class="bar" style="background:#D97706">Warning</div><div class="body"><div class="name">בהליך פשרה</div><div class="hex">#D97706 · #FEF3C7</div><span class="pill" style="background:#FEF3C7;color:#D97706;border-color:#D9770640"><span class="dot" style="background:#D97706"></span>ממתין</span></div></div>
    <div class="sw"><div class="bar" style="background:#DC2626">Danger</div><div class="body"><div class="name">פג תוקף</div><div class="hex">#DC2626 · #FEE2E2</div><span class="pill" style="background:#FEE2E2;color:#DC2626;border-color:#DC262640"><span class="dot" style="background:#DC2626"></span>נדחה</span></div></div>
    <div class="sw"><div class="bar" style="background:#2563EB">Info</div><div class="body"><div class="name">התקבלה</div><div class="hex">#2563EB · #DBEAFE</div><span class="pill" style="background:#DBEAFE;color:#2563EB;border-color:#2563EB40"><span class="dot" style="background:#2563EB"></span>בחלוקה</span></div></div>
  </div>
</body>
</html>
